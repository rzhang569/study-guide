# Builds the fictional PROB 101 demo course and publishes only that page to GitHub Pages.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "skills/study-guide/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the demo page
        run: |
          mkdir -p _site
          python3 skills/study-guide/scripts/build.py skills/study-guide/examples/demo -o _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
